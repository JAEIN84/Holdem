<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>
/* 로그인 전이면 화면을 그리기 전에 바로 로그인 페이지로 이동 (메인 화면이 잠깐 보이는 현상 방지) */
(function () { try { if (!sessionStorage.getItem('holdem_token')) {
  var here = location.pathname.split('/').pop() || 'index.html';
  location.replace('login.html?next=' + encodeURIComponent(here + location.search + location.hash));
} } catch (e) {} })();
</script>

<link rel="apple-touch-icon" href="record-icon.png">
<link rel="stylesheet" href="app.css?v=1">
<style>

body { padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
.topline { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; font-size: 14px; font-weight: 600; color: var(--sub); }
.topline a { color: var(--brand); text-decoration: none; font-weight: 700; }
:root[data-theme="dark"] .topline a { color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .topline a { color: var(--gold); } }
.banner { background: color-mix(in srgb, var(--gold) 16%, var(--surface)); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 13.5px; margin: 10px 0 0; }
.title-row { display: flex; align-items: baseline; justify-content: space-between; }
.link-btn { border: 0; background: none; color: var(--warn); font-weight: 700; font-size: 15px; padding: 6px 0; }
.card { background: var(--surface); border-radius: 16px; padding: 4px 16px; margin-bottom: 14px; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
.field + .field { border-top: 1px solid var(--line); }
.field label, .field .lbl { font-weight: 600; }
input[type="date"], .text-in { border: 0; background: var(--surface-2); border-radius: 10px; padding: 8px 12px; font-size: 16px; font-weight: 600; min-width: 0; }
input[type="date"] { min-height: 38px; }
.wrap-pills { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 0 14px; }
.sec { font-size: 13px; color: var(--sub); font-weight: 600; margin: 20px 4px 8px; display: flex; justify-content: space-between; align-items: baseline; }
.sec button { border: 0; background: none; color: var(--sub); font-size: 13px; font-weight: 700; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.add-row { display: flex; gap: 8px; padding: 0 0 14px; }
.add-row .text-in { flex: 1; }
.btn { border: 0; border-radius: 12px; height: 44px; padding: 0 16px; font-weight: 700; font-size: 15px; background: var(--ink); color: var(--surface); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }

/* 결과 입력 */
.res-row { display: grid; grid-template-columns: 1fr auto 112px; align-items: center; gap: 10px; min-height: 60px; }
.res-row + .res-row { border-top: 1px solid var(--line); }
.res-name { display: flex; align-items: center; gap: 8px; font-weight: 700; min-width: 0; }
.sign { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.sign button { border: 0; background: none; width: 44px; height: 34px; border-radius: 8px; font-weight: 800; font-size: 14px; color: var(--faint); }
.sign button[aria-pressed="true"].p { background: var(--pos); color: #fff; }
.sign button[aria-pressed="true"].m { background: var(--neg); color: #fff; }
.amt { width: 100%; height: 42px; border: 0; border-radius: 10px; background: var(--surface-2); text-align: right; padding: 0 12px; font-size: 19px; font-weight: 800; }
.amt.p { color: var(--pos); } .amt.m { color: var(--neg); }
.amt::placeholder { color: var(--faint); font-weight: 500; font-size: 15px; }
.hint { color: var(--sub); font-size: 14px; padding: 16px 0; text-align: center; }

/* 하단 저장 바 */
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--bar-bg); backdrop-filter: saturate(1.6) blur(18px); -webkit-backdrop-filter: saturate(1.6) blur(18px); border-top: 1px solid var(--line); }
.savebar-in { max-width: 448px; margin: 0 auto; }
.sum-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; margin-bottom: 8px; min-height: 30px; }
.sum-line .msg { color: var(--sub); font-weight: 600; }
.sum-line .msg.ok { color: var(--brand); }
:root[data-theme="dark"] .sum-line .msg.ok { color: #4CC38A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sum-line .msg.ok { color: #4CC38A; } }
.sum-line .msg.bad { color: var(--warn); }
.sum-line .tot { font-weight: 800; font-size: 18px; }
.auto { border: 0; background: var(--surface-2); color: var(--ink); border-radius: 999px; height: 30px; padding: 0 12px; font-size: 13px; font-weight: 700; }
.save { width: 100%; height: 52px; border: 0; border-radius: 14px; font-size: 17px; font-weight: 800; background: var(--brand); color: #fff; }
.save:disabled { background: var(--line); color: var(--faint); }
.save.warn { background: var(--warn); }

/* 최근 기록 */
.rec { background: var(--surface); border-radius: 16px; padding: 12px 16px; margin-bottom: 10px; }
.rec-head { display: flex; align-items: center; gap: 8px; }
.rec-date { font-weight: 800; }
.rec-place { color: var(--sub); font-size: 13px; font-weight: 600; }
.rec-act { margin-left: auto; display: flex; gap: 6px; }
.rec-act button { border: 0; background: var(--surface-2); border-radius: 8px; height: 30px; padding: 0 10px; font-size: 13px; font-weight: 700; color: var(--ink); }
.rec-act button.del { color: var(--warn); }
.rec-res { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 14px; }
.rec-res span b { font-weight: 800; }
.rec.editing { outline: 2px solid var(--gold); }
.rec-by { margin-top: 6px; font-size: 12px; color: var(--faint); font-weight: 600; }
.sec select { font-size: 13px; font-weight: 600; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.more { width: 100%; margin-top: 2px; }
.foot { display: flex; justify-content: center; gap: 10px; margin: 24px 0 8px; }

/* 비밀번호 시트 */
.sheet { position: fixed; inset: 0; z-index: 40; display: grid; align-items: end; background: rgba(0,0,0,.45); }
.sheet[hidden] { display: none; }
.sheet-in { background: var(--surface); border-radius: 22px 22px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px)); max-width: 480px; width: 100%; margin: 0 auto; }
.sheet h2 { margin: 0 0 4px; font-size: 21px; font-weight: 800; }
.sheet p { margin: 0 0 16px; color: var(--sub); font-size: 14px; }
.sheet .err { color: var(--warn); font-weight: 600; min-height: 20px; margin: 8px 0 0; }
.pin-in { width: 100%; height: 54px; border: 0; border-radius: 14px; background: var(--surface-2); font-size: 22px; font-weight: 800; letter-spacing: .18em; text-align: center; }
.sheet .save { margin-top: 12px; }

/* ===== 넓은 화면: 폴더블(펼침)·태블릿·PC ===== */
@media (min-width: 760px), (orientation: landscape) and (max-height: 500px) and (min-width: 600px) {
  body { padding-bottom: 40px; }
  .app { max-width: 1080px; padding: 0 32px; }
  .large-title { font-size: 36px; }
  .rec-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
  .col-form { padding-bottom: 150px; }
  .col-list .sec:first-child { margin-top: 0; }
  .col-list { padding-top: 0; }
  .savebar { left: max(32px, calc(50% - 540px + 32px)); right: auto; width: min(calc(50% - 48px), calc((1080px - 64px - 32px) / 2));
    bottom: 16px; border: 1px solid var(--line); border-radius: 18px; padding: 12px 16px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
  .savebar-in { max-width: none; }
  .toast { bottom: 140px; left: 50%; }
}
@media (min-width: 1200px) {
  .app { max-width: 1160px; }
  .savebar { left: calc(50% - 580px + 32px); width: calc((1160px - 64px - 32px) / 2); }
  .col-list #recent { display: grid; grid-template-columns: 1fr; }
}

.app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 760px) and (min-height: 760px) {
  .col-form { position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); }
}
/* ===== 휴대폰 가로 모드: 저장 바를 한 줄로 줄여 입력 공간 확보 ===== */
@media (orientation: landscape) and (max-height: 500px) {
  .large-title { font-size: 26px; margin-top: 6px; }
  .col-form { padding-bottom: 90px; }
  .savebar { left: 0; right: 0; width: auto; bottom: 0; border-radius: 0; border-width: 1px 0 0; box-shadow: none;
    padding: 8px max(20px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
  .savebar-in { display: flex; align-items: center; gap: 12px; max-width: 1080px; margin: 0 auto; }
  .sum-line { flex: 1; margin: 0; flex-wrap: wrap; gap: 4px 10px; }
  .save { width: auto; min-width: 150px; height: 46px; padding: 0 18px; }
  .toast { bottom: 80px; }
}

/* iOS 홈 화면 앱: 내용이 짧은 화면에서는 기기가 화면 높이를 상태표시줄만큼 짧게 계산해
   하단 탭바가 위로 떠 보이는 문제 → 문서를 항상 화면보다 조금 길게 만들어 정상 높이로 계산되게 함 */
body { min-height: calc(100vh + env(safe-area-inset-top, 0px) + 1px); min-height: calc(100lvh + env(safe-area-inset-top, 0px) + 1px); }

.amt-wrap { position: relative; display: block; }
.amt-wrap .amt { padding-right: 30px; }
.amt-u { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); font-size: 13px; font-weight: 700; color: var(--sub); pointer-events: none; }

.draft-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: color-mix(in srgb, var(--gold) 16%, var(--surface)); border-radius: 14px; padding: 10px 12px; margin: 16px 0 0; font-size: 13.5px; font-weight: 700; }
.draft-bar span { flex: 1 1 100%; }
.draft-bar button { border: 0; border-radius: 10px; height: 34px; padding: 0 14px; font-weight: 800; font-size: 13.5px; background: var(--ink); color: var(--surface); }
.draft-bar button.ghost { background: var(--surface); color: var(--ink); }
.rsvp-import { display: block; width: 100%; margin: 14px 0 0; border: 1.5px dashed var(--line); background: var(--surface); border-radius: 14px; padding: 11px; font-size: 14px; font-weight: 700; color: var(--ink); }
.saved-note { font-size: 12px; color: var(--faint); font-weight: 600; }
</style>

<body>
<div class="app">
  <div class="topline"><span id="me-line">기록 관리</span><a id="dash-link" href="index.html">Dashboard ›</a></div>
  <div id="banner"></div>
  <div class="title-row"><h1 class="large-title" id="form-title">New Game</h1><button type="button" class="link-btn" id="cancel-edit" hidden>수정 취소</button></div>

  <div class="rec-grid"><div class="col-form">
  <div class="card">
    <div class="field"><label for="date">날짜</label><input type="date" id="date"></div>
    <div class="field"><span class="lbl">장소</span><input class="text-in" id="place-custom" placeholder="장소 이름" maxlength="20" hidden></div>
    <div class="wrap-pills" id="places" style="padding-top:0"></div>
  </div>

  <div class="draft-bar" id="draft-bar" hidden><span id="draft-text">작성 중이던 기록이 있습니다</span><button type="button" id="draft-load">이어서 작성</button><button type="button" class="ghost" id="draft-drop">버리기</button></div>
  <button type="button" class="rsvp-import" id="rsvp-import" hidden></button>
  <div class="sec"><span>참가자</span><button type="button" id="toggle-add">플레이어 추가</button></div>
  <div class="card">
    <div class="wrap-pills" id="players"></div>
    <div class="add-row" id="add-row" hidden><input class="text-in" id="new-name" placeholder="새 플레이어 이름" maxlength="12"><button type="button" class="btn" id="add-player">추가</button></div>
  </div>

  <div class="sec"><span>결과</span><span id="res-count"></span></div>
  <div class="card" id="results"></div>

  </div><div class="col-list">
  <div class="sec"><span>지난 기록</span><select id="rec-month" aria-label="월 선택"></select></div>
  <div id="recent"></div>
  <button type="button" class="btn ghost more" id="rec-more" hidden>더 보기</button>
  <div class="foot"><button type="button" class="btn ghost" id="backup">백업 파일 받기</button><button type="button" class="btn ghost" id="logout">로그아웃</button></div>
  </div></div>
</div>

<div class="savebar"><div class="savebar-in">
  <div class="sum-line"><span class="msg" id="sum-msg"></span><span id="sum-right"></span></div>
  <button type="button" class="save" id="save" disabled>경기 저장</button>
</div></div>

<div class="toast" id="toast"></div>

<script src="auth.js"></script>
<script src="common.js?v=1"></script>
<script>
const CONFIG = {
  DASHBOARD_URL: 'index.html',
  PLAYER_COLORS: ['#E0A100', '#0F9B8E', '#7B4FC9', '#E0662A', '#4F7A99', '#C2417F', '#3E9A45', '#8C6D3F'],
  DEFAULT_PLACES: ['천안', '인천', '수원']
};
const ME = Auth.require(['editor', 'admin']);

const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const colorOf = name => CONFIG.PLAYER_COLORS[Math.max(0, doc.players.indexOf(name)) % CONFIG.PLAYER_COLORS.length];

let doc = null, editId = null;
const form = { date: today(), place: '', custom: false, picked: [], vals: {} };

$('#logout').onclick = () => { if (confirm('로그아웃할까요?')) Auth.logout(); };

/* ===== 폼 렌더 ===== */
function places() {
  const cnt = {}; doc.sessions.forEach(s => { if (s.place) cnt[s.place] = (cnt[s.place] || 0) + 1; });
  const list = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);
  CONFIG.DEFAULT_PLACES.forEach(p => { if (!list.includes(p)) list.push(p); });
  return list;
}
function renderTop() {
  $('#form-title').textContent = editId ? 'Edit Game' : 'New Game';
  $('#cancel-edit').hidden = !editId;
  if (!fromDash) $('#cancel-edit').textContent = '수정 취소';
  $('#save').textContent = editId ? '수정 저장' : '경기 저장';
  $('#date').value = form.date;
  const pl = places();
  $('#places').innerHTML = pl.map(p => `<button type="button" class="pill" data-p="${esc(p)}" aria-pressed="${!form.custom && form.place === p}">${esc(p)}</button>`).join('')
    + `<button type="button" class="pill" data-p="" aria-pressed="${form.custom}">직접 입력</button>`;
  $('#place-custom').hidden = !form.custom;
  if (form.custom) $('#place-custom').value = form.place;
  $('#players').innerHTML = doc.players.map(p => `<button type="button" class="pill" data-p="${esc(p)}" aria-pressed="${form.picked.includes(p)}">${chip(colorOf(p))}${esc(p)}</button>`).join('');
}
function renderResults() {
  $('#res-count').textContent = form.picked.length ? `${form.picked.length}명` : '';
  if (!form.picked.length) { $('#results').innerHTML = `<p class="hint">참가자를 선택하면 금액 입력칸이 나타납니다</p>`; updateSum(); return; }
  $('#results').innerHTML = form.picked.map(p => {
    const v = form.vals[p], s = v.sign > 0 ? 'p' : 'm';
    return `<div class="res-row" data-p="${esc(p)}">
      <span class="res-name">${chip(colorOf(p))}${esc(p)}</span>
      <span class="sign" role="group" aria-label="${esc(p)} 이익 또는 손실">
        <button type="button" class="p" data-s="1" aria-pressed="${v.sign > 0}" aria-label="이익">＋</button>
        <button type="button" class="m" data-s="-1" aria-pressed="${v.sign < 0}" aria-label="손실">−</button></span>
      <span class="amt-wrap"><input class="amt ${s}" inputmode="numeric" pattern="[0-9]*" placeholder="금액" value="${v.amt}" aria-label="${esc(p)} 금액(만원)" maxlength="7"><span class="amt-u" aria-hidden="true">만</span></span>
    </div>`;
  }).join('');
  updateSum();
}
function totals() {
  const empty = form.picked.filter(p => form.vals[p].amt === '');
  const total = form.picked.reduce((a, p) => a + (form.vals[p].amt === '' ? 0 : form.vals[p].sign * Number(form.vals[p].amt)), 0);
  return { empty, total };
}
function updateSum() {
  const { empty, total } = totals(), msg = $('#sum-msg'), right = $('#sum-right'), btn = $('#save');
  btn.classList.remove('warn'); msg.className = 'msg'; right.innerHTML = '';
  if (form.picked.length < 2) { msg.textContent = '참가자를 2명 이상 선택하세요'; btn.disabled = true; return; }
  if (empty.length) {
    msg.textContent = `금액을 입력하세요 (${empty.length}명 남음)`; btn.disabled = true;
    if (empty.length === 1) right.innerHTML = `<button type="button" class="auto" id="autofill">${esc(empty[0])} 자동 계산</button>`;
    return;
  }
  btn.disabled = false;
  right.innerHTML = `<span class="tot ${tone(total)}">합계 ${signed(total)}</span>`;
  if (total === 0) { msg.textContent = '합계가 0으로 맞습니다'; msg.classList.add('ok'); }
  else { msg.textContent = '합계가 0이 아닙니다'; msg.classList.add('bad'); btn.classList.add('warn'); }
}

/* ===== 입력 중 임시 저장: 저장 순간 연결이 끊겨도 입력이 사라지지 않게 ===== */
const DRAFT_KEY = 'holdem_record_draft';
function hasInput() { return form.picked.length && form.picked.some(p => form.vals[p] && form.vals[p].amt !== ''); }
function saveDraft() {
  try { if (hasInput()) localStorage.setItem(DRAFT_KEY, JSON.stringify({ form, editId, savedAt: Date.now() })); else localStorage.removeItem(DRAFT_KEY); } catch (e) {}
}
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} $('#draft-bar').hidden = true; }
function offerDraft() {
  let d = null; try { d = JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch (e) {}
  if (!d || !d.form || !d.form.picked || !d.form.picked.length) return;
  const t = new Date(d.savedAt), n = d.form.picked.length;
  $('#draft-text').textContent = `작성 중이던 기록이 있습니다 (${d.form.date.replace(/-/g, '.')} ${d.form.place || ''}, ${n}명, ${t.getMonth() + 1}/${t.getDate()} ${t.toTimeString().slice(0, 5)} 저장)`;
  $('#draft-bar').hidden = false;
  $('#draft-load').onclick = () => {
    Object.assign(form, d.form); editId = d.editId && doc && doc.sessions.some(x => x.id === d.editId) ? d.editId : null;
    renderTop(); renderResults(); renderRecent(); $('#draft-bar').hidden = true; toast('이어서 작성합니다');
  };
  $('#draft-drop').onclick = () => { if (confirm('작성 중이던 기록을 버릴까요?')) clearDraft(); };
}
['input', 'click', 'change'].forEach(ev => document.querySelector('.col-form').addEventListener(ev, () => setTimeout(saveDraft, 0)));

/* ===== 다음 모임 참석자 불러오기 ===== */
let EVENTS = null;
function offerRsvp() {
  const btn = $('#rsvp-import'); btn.hidden = true;
  if (!EVENTS || editId) return;
  const ev = [...(EVENTS.upcoming || []), ...(EVENTS.past || [])].find(e => e.date === form.date);
  if (!ev) return;
  const yes = ev.rsvps.filter(r => r.status === 'yes' && r.player && doc.players.includes(r.player)).map(r => r.player);
  if (!yes.length) return;
  btn.textContent = `📋 ${form.date.slice(5).replace('-', '/')} 모임 참석자 ${yes.length}명 불러오기 (${yes.join(', ')})`;
  btn.hidden = false;
  btn.onclick = () => {
    yes.forEach(p => { if (!form.picked.includes(p)) { form.picked.push(p); form.vals[p] = form.vals[p] || { sign: 1, amt: '' }; } });
    if (ev.place && !form.place) form.place = ev.place;
    if (ev.place && places().includes(ev.place)) { form.place = ev.place; form.custom = false; }
    renderTop(); renderResults(); btn.hidden = true; toast(`참석자 ${yes.length}명을 불러왔습니다`);
  };
}

/* ===== 폼 이벤트 ===== */
$('#date').onchange = e => { form.date = e.target.value; offerRsvp(); };
$('#places').onclick = e => {
  const b = e.target.closest('.pill'); if (!b) return;
  if (b.dataset.p) { form.place = b.dataset.p; form.custom = false; } else { form.custom = true; form.place = ''; }
  renderTop(); if (form.custom) $('#place-custom').focus();
};
$('#place-custom').oninput = e => { form.place = e.target.value.trim(); };
$('#players').onclick = e => {
  const b = e.target.closest('.pill'); if (!b) return;
  const p = b.dataset.p;
  if (form.picked.includes(p)) form.picked = form.picked.filter(x => x !== p);
  else { form.picked.push(p); form.vals[p] = form.vals[p] || { sign: 1, amt: '' }; }
  renderTop(); renderResults();
};
$('#results').addEventListener('click', e => {
  const b = e.target.closest('.sign button'); if (!b) return;
  const p = b.closest('.res-row').dataset.p; form.vals[p].sign = Number(b.dataset.s);
  renderResults();
});
$('#results').addEventListener('input', e => {
  if (!e.target.classList.contains('amt')) return;
  const clean = e.target.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 7);
  if (clean !== e.target.value) e.target.value = clean;
  form.vals[e.target.closest('.res-row').dataset.p].amt = clean;
  updateSum();
});
$('#sum-right').addEventListener('click', e => {
  if (e.target.id !== 'autofill') return;
  const { empty, total } = totals(); const p = empty[0];
  form.vals[p] = { sign: total > 0 ? -1 : 1, amt: String(Math.abs(total)) };
  renderResults();
});
$('#toggle-add').onclick = () => { $('#add-row').hidden = !$('#add-row').hidden; if (!$('#add-row').hidden) $('#new-name').focus(); };
$('#add-player').onclick = async () => {
  const name = $('#new-name').value.trim(); if (!name) return;
  try { doc = await api('POST', '/api/players', { name }); $('#new-name').value = ''; $('#add-row').hidden = true; toast(`${name} 추가했습니다`); renderTop(); }
  catch (e) { toast(e.message); }
};

/* ===== 저장 ===== */
$('#save').onclick = async () => {
  const { total } = totals();
  if (total !== 0 && !confirm(`합계가 ${signedT(total)}만입니다. 그래도 저장할까요?`)) return;
  if (!form.date) { toast('날짜를 선택하세요'); return; }
  if (!form.place) { toast('장소를 선택하거나 입력하세요'); return; }
  const dup = doc.sessions.find(x => x.id !== editId && x.date === form.date && x.place === form.place);
  if (dup && !confirm(`${form.date.replace(/-/g, '.')} ${form.place} 경기가 이미 등록되어 있습니다. 같은 날 다른 판이면 계속 저장하세요.`)) return;
  const res = Object.fromEntries(form.picked.map(p => [p, form.vals[p].sign * Number(form.vals[p].amt)]));
  const body = { date: form.date, place: form.place, res };
  const btn = $('#save'); btn.disabled = true; btn.textContent = '저장 중…';
  try {
    doc = editId ? await api('PUT', '/api/sessions/' + editId, body) : await api('POST', '/api/sessions', body);
    toast(editId ? '수정했습니다' : '저장했습니다');
    clearDraft();
    const back = fromDash && editId, wasEdit = !!editId;
    resetForm(!wasEdit);
    if (back) { fromDash = false; setTimeout(() => { location.href = CONFIG.DASHBOARD_URL + '#games'; }, 700); }
  } catch (e) { saveDraft(); toast(`저장하지 못했습니다: ${e.message} 입력 내용은 이 기기에 보관해 두었습니다.`); renderTop(); updateSum(); }
};
function resetForm(keepPlayers) {
  editId = null;
  if (keepPlayers) form.picked.forEach(p => { form.vals[p] = { sign: 1, amt: '' }; });
  else { form.picked = []; form.vals = {}; }
  renderTop(); renderResults(); renderRecent();
}
$('#cancel-edit').onclick = () => {
  clearDraft();
  if (fromDash) { location.href = CONFIG.DASHBOARD_URL + '#games'; return; }
  form.date = today(); resetForm();
};

/* ===== 지난 기록 (월 선택 + 더 보기) ===== */
const PAGE = 15;
let recLimit = PAGE, recMonth = '';
function renderRecent() {
  const all = doc.sessions.slice().sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const months = [...new Set(all.map(s => s.date.slice(0, 7)))];
  if (recMonth && !months.includes(recMonth)) recMonth = '';
  $('#rec-month').innerHTML = `<option value="">전체 ${all.length}경기</option>` +
    months.map(m => `<option value="${m}">${m.slice(0, 4)}년 ${Number(m.slice(5))}월</option>`).join('');
  $('#rec-month').value = recMonth;
  const filtered = recMonth ? all.filter(s => s.date.startsWith(recMonth)) : all;
  const list = recMonth ? filtered : filtered.slice(0, recLimit);
  const more = $('#rec-more');
  more.hidden = !!recMonth || filtered.length <= recLimit;
  more.textContent = `더 보기 (${filtered.length - list.length}경기 남음)`;
  if (!list.length) { $('#recent').innerHTML = `<p class="hint">아직 기록이 없습니다. 위에서 첫 경기를 등록하세요.</p>`; return; }
  $('#recent').innerHTML = list.map(s => {
    const [y, m, d] = s.date.split('-').map(Number), dow = DOW[new Date(y, m - 1, d).getDay()];
    const res = Object.entries(s.res).sort((a, b) => b[1] - a[1]);
    return `<div class="rec${s.id === editId ? ' editing' : ''}" data-id="${s.id}">
      <div class="rec-head"><span class="rec-date">${String(y).slice(2)}.${String(m).padStart(2, '0')}.${String(d).padStart(2, '0')} (${dow})</span><span class="rec-place">${esc(s.place)}</span>
        <span class="rec-act"><button type="button" data-a="edit">수정</button><button type="button" class="del" data-a="del">삭제</button></span></div>
      <div class="rec-res">${res.map(([p, v]) => `<span>${esc(p)} <b class="${tone(v)}">${signed(v)}</b></span>`).join('')}</div>
      ${s.updated ? `<div class="rec-by">${s.created && s.created.at !== s.updated.at ? '수정' : '등록'} ${esc(s.updated.byName)}, ${s.updated.at.slice(5, 10).replace('-', '.')} ${new Date(s.updated.at).toTimeString().slice(0, 5)}</div>` : ''}</div>`;
  }).join('');
}
$('#rec-month').onchange = e => { recMonth = e.target.value; recLimit = PAGE; renderRecent(); };
$('#rec-more').onclick = () => { recLimit += PAGE; renderRecent(); };
$('#recent').addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const id = b.closest('.rec').dataset.id, s = doc.sessions.find(x => x.id === id);
  if (b.dataset.a === 'edit') {
    fromDash = false; startEdit(id);
  } else if (confirm(`${s.date.replace(/-/g, '.')} ${s.place} 경기를 삭제할까요? 되돌릴 수 없습니다.`)) {
    try { doc = await api('DELETE', '/api/sessions/' + id); if (editId === id) resetForm(); else renderRecent(); toast('삭제했습니다'); }
    catch (err) { toast(err.message); }
  }
});

/* ===== 수정 모드 진입 (목록 또는 대시보드에서) ===== */
let fromDash = false;
function startEdit(id) {
  const s = doc.sessions.find(x => x.id === id);
  if (!s) { toast('해당 경기를 찾을 수 없습니다'); return false; }
  editId = id; form.date = s.date; form.place = s.place;
  form.custom = !places().includes(s.place) && !!s.place;
  form.picked = Object.keys(s.res);
  form.vals = Object.fromEntries(Object.entries(s.res).map(([p, v]) => [p, { sign: v < 0 ? -1 : 1, amt: String(Math.abs(v)) }]));
  renderTop(); renderResults(); renderRecent(); window.scrollTo({ top: 0, behavior: 'smooth' });
  return true;
}

/* ===== 백업 ===== */
$('#backup').onclick = () => {
  const blob = new Blob([JSON.stringify(doc, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `holdem-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

/* ===== 시작 ===== */
(async function init() {
  $('#dash-link').href = CONFIG.DASHBOARD_URL;
  if (!ME) return;
  if (ME.denied) {
    document.querySelector('.rec-grid').innerHTML = `<p class="hint">${esc(ME.name)}님은 조회 권한만 있습니다. 기록 권한이 필요하면 관리자에게 요청하세요.</p>`;
    document.querySelector('.savebar').hidden = true; $('#form-title').textContent = 'New Game'; return;
  }
  $('#me-line').textContent = `${ME.name}님`;
  try { [doc, EVENTS] = await Promise.all([api('GET', '/api/data'), api('GET', '/api/events').catch(() => null)]); }
  catch (e) { $('#results').innerHTML = `<p class="hint">기록을 불러오지 못했습니다. ${esc(e.message)}</p>`; offerDraft(); return; }
  const pl = places(); form.place = pl[0] || '';
  renderTop(); renderResults(); renderRecent();
  offerDraft(); offerRsvp();
  const want = new URLSearchParams(location.search).get('edit');
  if (want) {
    if (startEdit(want)) { fromDash = true; $('#cancel-edit').textContent = '취소하고 돌아가기'; }
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  }
})();
</script>
</body>
</html>
