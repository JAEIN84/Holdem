<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Members only — Hold’em league standings and game log.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hold’em League">
<meta property="og:title" content="Hold’em League">
<meta property="og:description" content="Members only — Hold’em league standings and game log.">
<meta property="og:image" content="https://jaein84.github.io/Holdem/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hold’em">
<meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0D0B" media="(prefers-color-scheme: dark)">
<title>Hold’em League</title>
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --bg: #F2F4F1; --surface: #FFFFFF; --surface-2: #F7F8F6; --ink: #111A15; --sub: #66736C; --faint: #9AA59F; --line: #E3E8E4;
  --brand: #0F5A3F; --brand-2: #0A3F2C; --gold: #B8892B; --pos: #DC3B30; --neg: #2563EB; --warn: #D93A2F; --zero: #9AA59F;
  --bar-bg: rgba(255,255,255,.86);
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0D0B; --surface: #141916; --surface-2: #1A201C; --ink: #EEF2EF; --sub: #93A099; --faint: #66736C; --line: #242B27;
    --brand: #145F44; --brand-2: #0B3A29; --gold: #DDB65C; --pos: #FF6F64; --neg: #6EA1FF; --warn: #FF7468; --zero: #6E7A74;
    --bar-bg: rgba(20,25,22,.86);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0D0B; --surface: #141916; --surface-2: #1A201C; --ink: #EEF2EF; --sub: #93A099; --faint: #66736C; --line: #242B27;
  --brand: #145F44; --brand-2: #0B3A29; --gold: #DDB65C; --pos: #FF6F64; --neg: #6EA1FF; --warn: #FF7468; --zero: #6E7A74;
  --bar-bg: rgba(20,25,22,.86);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; font-feature-settings: "tnum"; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .zero { color: var(--zero); }
.chip { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block; background: var(--c);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.92), inset 0 0 0 4px var(--c); }
.app { max-width: 480px; margin: 0 auto; padding: 0 16px; }
.large-title { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 14px 0 2px; }
.caption { color: var(--sub); font-size: 14px; margin: 0 0 18px; }
.group { background: var(--surface); border-radius: 16px; overflow: hidden; margin-bottom: 18px; }
.group-title { font-size: 13px; color: var(--sub); font-weight: 600; margin: 22px 4px 8px; }
.scroller { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 14px; padding: 2px 16px; }
.scroller::-webkit-scrollbar { display: none; }
.pill { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600; color: var(--sub); }
.pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(12px); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: .2s; z-index: 50; white-space: nowrap; }
.toast.on { opacity: 1; transform: translateX(-50%); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { min-height: 100vh; }
.wrap { max-width: 420px; margin: 0 auto; padding: 0 max(20px, env(safe-area-inset-right, 0px)) 40px max(20px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 28px 0 20px; }
.brand .hero { display: block; width: 100%; height: auto; aspect-ratio: 1200 / 630; border-radius: 20px; object-fit: cover;
  box-shadow: 0 14px 34px rgba(80, 8, 20, .28); background: #5A0C18; }
.brand p { margin: 14px 0 0; color: var(--sub); font-size: 14px; font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (orientation: landscape) and (max-height: 500px) { .brand { padding-top: 14px; } .brand .hero { max-width: 300px; } }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; margin-bottom: 16px; border: 1px solid var(--line); }
.tabs button { border: 0; background: none; height: 40px; border-radius: 9px; font-weight: 700; font-size: 15px; color: var(--sub); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.panel { background: var(--surface); border-radius: 18px; padding: 20px 18px 18px; }
.f { margin-bottom: 14px; }
.f label { display: block; font-size: 13px; font-weight: 700; color: var(--sub); margin: 0 2px 6px; }
.f input { width: 100%; height: 50px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); padding: 0 14px; font-size: 16px; font-weight: 600; }
.f input:focus { outline: none; border-color: #8E1A2B; }
.f input[aria-invalid="true"] { border-color: var(--warn); }
.hint { font-size: 12.5px; color: var(--faint); margin: 6px 2px 0; }
.hint.bad { color: var(--warn); } .hint.ok { color: #1F9D62; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--sub); margin: 2px 2px 16px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: #8E1A2B; }
.primary { width: 100%; height: 52px; border: 0; border-radius: 14px; background: linear-gradient(180deg, #8E1A2B, #6A0F1D); color: #fff; font-size: 17px; font-weight: 800; }
.primary:disabled { background: var(--line); color: var(--faint); }
.msg { min-height: 22px; font-size: 14px; font-weight: 600; margin: 12px 2px 0; text-align: center; }
.msg.bad { color: var(--warn); } .msg.ok { color: #1F9D62; }
.done { text-align: center; padding: 10px 4px 4px; }
.done .ic { font-size: 42px; }
.done h2 { margin: 8px 0 6px; font-size: 20px; font-weight: 800; }
.done p { margin: 0 0 18px; color: var(--sub); font-size: 14.5px; }
.foot { text-align: center; color: var(--faint); font-size: 12.5px; margin-top: 22px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">
    <img class="hero" src="og-image.png" alt="Hold’em League" width="1200" height="630">
    <h1 class="sr">Hold’em League</h1>
    <p>승인된 멤버만 이용할 수 있습니다</p>
  </div>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="t-login" aria-selected="true" aria-controls="p-login">로그인</button>
    <button type="button" role="tab" id="t-join" aria-selected="false" aria-controls="p-join">가입 신청</button>
  </div>

  <!-- 로그인 -->
  <form class="panel" id="p-login" role="tabpanel" novalidate>
    <div class="f"><label for="l-id">아이디</label>
      <input id="l-id" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required></div>
    <div class="f"><label for="l-pw">비밀번호</label>
      <input id="l-pw" name="password" type="password" autocomplete="current-password" required></div>
    <label class="check"><input type="checkbox" id="l-save"> 아이디 저장</label>
    <button class="primary" id="l-btn" type="submit">로그인</button>
    <p class="msg" id="l-msg" role="status"></p>
  </form>

  <!-- 가입 신청 -->
  <form class="panel" id="p-join" role="tabpanel" novalidate hidden>
    <div class="f"><label for="j-id">아이디</label>
      <input id="j-id" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="20">
      <p class="hint" id="h-id">영문 소문자, 숫자, 밑줄(_) 4~20자</p></div>
    <div class="f"><label for="j-name">성명</label>
      <input id="j-name" autocomplete="name" maxlength="20"></div>
    <div class="f"><label for="j-pw">비밀번호</label>
      <input id="j-pw" type="password" autocomplete="new-password" maxlength="64">
      <p class="hint" id="h-pw">영문과 숫자를 섞어 8자 이상</p></div>
    <div class="f"><label for="j-pw2">비밀번호 확인</label>
      <input id="j-pw2" type="password" autocomplete="new-password" maxlength="64">
      <p class="hint" id="h-pw2"></p></div>
    <div class="f"><label for="j-phone">연락처</label>
      <input id="j-phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-1234-5678" maxlength="13"></div>
    <button class="primary" id="j-btn" type="submit" disabled>가입 신청</button>
    <p class="msg" id="j-msg" role="status"></p>
  </form>

  <!-- 신청 완료 -->
  <div class="panel done" id="p-done" hidden>
    <div class="ic" aria-hidden="true">♠</div>
    <h2 id="d-title">가입 신청이 접수되었습니다</h2>
    <p id="d-text">관리자가 승인하면 로그인할 수 있습니다.</p>
    <button class="primary" type="button" id="d-btn">로그인 화면으로</button>
  </div>

  <p class="foot">로그인은 앱을 닫기 전까지 유지됩니다</p>
</main>

<script src="auth.js"></script>
<script>
const $ = s => document.querySelector(s);
const PAGES = Object.values(HOLDEM.PAGES);
function nextPage() {
  const n = new URLSearchParams(location.search).get('next') || '';
  const file = n.split(/[?#]/)[0];
  return PAGES.includes(file) && file !== HOLDEM.PAGES.login ? n : HOLDEM.PAGES.dashboard;
}
if (Auth.token() && Auth.user()) location.replace(nextPage());

/* 탭 전환 */
function tab(which) {
  $('#t-login').setAttribute('aria-selected', which === 'login');
  $('#t-join').setAttribute('aria-selected', which === 'join');
  $('#p-login').hidden = which !== 'login'; $('#p-join').hidden = which !== 'join'; $('#p-done').hidden = true;
}
$('#t-login').onclick = () => tab('login');
$('#t-join').onclick = () => tab('join');

/* 로그인 */
const saved = Auth.savedId();
if (saved) { $('#l-id').value = saved; $('#l-save').checked = true; setTimeout(() => $('#l-pw').focus(), 50); }
$('#p-login').onsubmit = async e => {
  e.preventDefault();
  const id = $('#l-id').value.trim().toLowerCase(), password = $('#l-pw').value, msg = $('#l-msg');
  if (!id || !password) { msg.className = 'msg bad'; msg.textContent = '아이디와 비밀번호를 입력하세요.'; return; }
  const btn = $('#l-btn'); btn.disabled = true; btn.textContent = '확인 중…'; msg.textContent = '';
  try {
    const r = await api('POST', '/api/login', { id, password });
    Auth.set(r.token, r.user);
    Auth.saveId($('#l-save').checked ? id : '');
    location.replace(nextPage());
  } catch (err) {
    msg.className = 'msg bad'; msg.textContent = err.message;
    btn.disabled = false; btn.textContent = '로그인';
  }
};

/* 가입 신청: 입력하면서 바로 확인 */
const ID_RE = /^[a-z0-9_]{4,20}$/;
const pwOk = v => v.length >= 8 && /[A-Za-z]/.test(v) && /\d/.test(v);
const phoneOk = v => /^01[0-9]-\d{3,4}-\d{4}$/.test(v);
function hint(el, input, ok, okText, badText, base) {
  const v = input.value;
  if (!v) { el.className = 'hint'; el.textContent = base || ''; input.removeAttribute('aria-invalid'); return; }
  el.className = 'hint ' + (ok ? 'ok' : 'bad'); el.textContent = ok ? okText : badText;
  ok ? input.removeAttribute('aria-invalid') : input.setAttribute('aria-invalid', 'true');
}
function validate() {
  const id = $('#j-id'), pw = $('#j-pw'), pw2 = $('#j-pw2'), ph = $('#j-phone'), nm = $('#j-name');
  id.value = id.value.toLowerCase();
  hint($('#h-id'), id, ID_RE.test(id.value), '사용할 수 있는 형식입니다', '영문 소문자, 숫자, 밑줄(_) 4~20자로 입력하세요', '영문 소문자, 숫자, 밑줄(_) 4~20자');
  hint($('#h-pw'), pw, pwOk(pw.value), '안전한 비밀번호입니다', '영문과 숫자를 섞어 8자 이상 입력하세요', '영문과 숫자를 섞어 8자 이상');
  hint($('#h-pw2'), pw2, pw2.value === pw.value, '비밀번호가 일치합니다', '비밀번호가 일치하지 않습니다', '');
  const all = ID_RE.test(id.value) && nm.value.trim() && pwOk(pw.value) && pw.value === pw2.value && phoneOk(ph.value);
  $('#j-btn').disabled = !all;
}
$('#j-phone').addEventListener('input', e => {
  const d = e.target.value.replace(/\D/g, '').slice(0, 11);
  e.target.value = d.length < 4 ? d : d.length < 8 ? `${d.slice(0, 3)}-${d.slice(3)}` : `${d.slice(0, 3)}-${d.slice(3, d.length - 4)}-${d.slice(-4)}`;
});
$('#p-join').addEventListener('input', validate);
$('#p-join').onsubmit = async e => {
  e.preventDefault(); validate(); if ($('#j-btn').disabled) return;
  const btn = $('#j-btn'), msg = $('#j-msg'); btn.disabled = true; btn.textContent = '신청 중…'; msg.textContent = '';
  try {
    const r = await api('POST', '/api/signup', { id: $('#j-id').value.trim(), name: $('#j-name').value.trim(), password: $('#j-pw').value, phone: $('#j-phone').value });
    $('#p-join').hidden = true; $('#p-done').hidden = false;
    $('#d-title').textContent = '가입 신청이 접수되었습니다'; $('#d-text').textContent = '관리자가 승인하면 로그인할 수 있습니다.';
    if (r.status === 'active') { $('#d-title').textContent = '관리자 계정이 만들어졌습니다'; $('#d-text').textContent = '바로 로그인할 수 있습니다.'; }
    $('#l-id').value = $('#j-id').value.trim();
    $('#p-join').reset(); validate();
  } catch (err) { msg.className = 'msg bad'; msg.textContent = err.message; }
  finally { btn.textContent = '가입 신청'; validate(); }
};
$('#d-btn').onclick = () => { tab('login'); $('#l-pw').focus(); };
</script>
</body>
</html>
