<style>
:root {
  --bg: #F2F4F1; --surface: #FFFFFF; --surface-2: #F7F8F6; --ink: #111A15; --sub: #66736C; --faint: #9AA59F; --line: #E3E8E4;
  --brand: #0F5A3F; --brand-2: #0A3F2C; --gold: #B8892B; --pos: #DC3B30; --neg: #2563EB; --warn: #D93A2F; --zero: #9AA59F;
  --bar-bg: rgba(255,255,255,.86);
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0D0B; --surface: #141916; --surface-2: #1A201C; --ink: #EEF2EF; --sub: #93A099; --faint: #66736C; --line: #242B27;
    --brand: #145F44; --brand-2: #0B3A29; --gold: #DDB65C; --pos: #FF6F64; --neg: #6EA1FF; --warn: #FF7468; --zero: #6E7A74;
    --bar-bg: rgba(20,25,22,.86);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0D0B; --surface: #141916; --surface-2: #1A201C; --ink: #EEF2EF; --sub: #93A099; --faint: #66736C; --line: #242B27;
  --brand: #145F44; --brand-2: #0B3A29; --gold: #DDB65C; --pos: #FF6F64; --neg: #6EA1FF; --warn: #FF7468; --zero: #6E7A74;
  --bar-bg: rgba(20,25,22,.86);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; font-feature-settings: "tnum"; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .zero { color: var(--zero); }
.chip { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block; background: var(--c);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.92), inset 0 0 0 4px var(--c); }
.app { max-width: 480px; margin: 0 auto; padding: 0 16px; }
.large-title { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 14px 0 2px; }
.caption { color: var(--sub); font-size: 14px; margin: 0 0 18px; }
.group { background: var(--surface); border-radius: 16px; overflow: hidden; margin-bottom: 18px; }
.group-title { font-size: 13px; color: var(--sub); font-weight: 600; margin: 22px 4px 8px; }
.scroller { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 14px; padding: 2px 16px; }
.scroller::-webkit-scrollbar { display: none; }
.pill { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600; color: var(--sub); }
.pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(12px); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: .2s; z-index: 50; white-space: nowrap; }
.toast.on { opacity: 1; transform: translateX(-50%); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
body { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
.topline { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; color: var(--sub); font-size: 13px; font-weight: 600; }
.top-actions { display: flex; align-items: center; gap: 12px; }
.pend { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--warn); color: #fff; font-size: 11px; }
.me { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--sub); }
.me-btn { border: 0; background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; }
.sheet { position: fixed; inset: 0; z-index: 60; display: grid; align-items: end; background: rgba(0,0,0,.45); }
.sheet-in { background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px 20px calc(20px + env(safe-area-inset-bottom, 0px)); max-width: 480px; width: 100%; margin: 0 auto; max-height: 92vh; overflow: auto; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-head h2 { margin: 0; font-size: 20px; font-weight: 800; }
.sheet-x { border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 50%; font-size: 15px; color: var(--sub); }
.sheet-sub { color: var(--sub); font-size: 13.5px; margin: 4px 0 14px; }
.sf { display: block; margin-bottom: 10px; }
.sf span { display: block; font-size: 13px; font-weight: 700; color: var(--sub); margin: 0 2px 5px; }
.sf input { width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); padding: 0 12px; font-size: 16px; }
.sheet-msg { min-height: 20px; margin: 2px 2px 8px; font-size: 13.5px; font-weight: 600; color: var(--sub); }
.sheet-msg.bad { color: var(--warn); } .sheet-msg.ok { color: #1F9D62; }
.sheet-btn { width: 100%; height: 48px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; font-size: 16px; font-weight: 800; }
.sheet-btn:disabled { background: var(--line); color: var(--faint); }
.sheet-out { width: 100%; height: 46px; margin-top: 10px; border: 0; border-radius: 12px; background: var(--surface-2); color: var(--warn); font-size: 15px; font-weight: 700; }
@media (orientation: landscape) and (max-height: 500px) { .sheet { align-items: center; } .sheet-in { border-radius: 18px; max-height: 96vh; } }
.me-out { border: 0; background: var(--surface); color: var(--sub); font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
.top-link { color: var(--brand); text-decoration: none; font-weight: 700; font-size: 14px; }
:root[data-theme="dark"] .top-link { color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .top-link { color: var(--gold); } }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface); color: var(--sub); display: grid; place-items: center; }
.icon-btn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 선두 카드 */
.leader {
  position: relative; overflow: hidden; border-radius: 20px; padding: 20px 20px 18px; color: #F4F1E8;
  background: radial-gradient(140% 120% at 100% 0%, rgba(255,255,255,.10), transparent 55%), linear-gradient(160deg, var(--brand), var(--brand-2));
}
.leader::after { content: "♠"; position: absolute; right: -6px; bottom: -40px; font-size: 170px; line-height: 1; color: rgba(255,255,255,.06); pointer-events: none; }
.leader-label { font-size: 13px; font-weight: 600; color: rgba(244,241,232,.72); display: flex; align-items: center; gap: 6px; }
.leader-label .crown { color: #E9C46A; }
.leader-name { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 700; margin-top: 8px; }
.leader-name .chip { width: 14px; height: 14px; }
.leader-value { font-size: 52px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin-top: 2px; }
.leader-sub { font-size: 14px; color: rgba(244,241,232,.75); margin-top: 6px; }

/* 순위 리스트 */
.rank-list { list-style: none; padding: 0; margin-top: 0; }
.rank-row { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 4px 10px; padding: 13px 16px 12px; border: 0; width: 100%; background: none; text-align: left; }
.rank-list li + li .rank-row { border-top: 1px solid var(--line); }
.rank-no { font-size: 15px; font-weight: 800; color: var(--faint); }
li:first-child .rank-no { color: var(--gold); }
.rank-name { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; min-width: 0; }
.rank-meta { grid-column: 2; font-size: 12.5px; color: var(--sub); }
.rank-meta b { font-weight: 700; }
.rank-val { grid-row: 1 / span 2; grid-column: 3; text-align: right; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.rank-bar { grid-column: 2 / 4; position: relative; height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 4px; }
.rank-bar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.rank-bar span { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.rank-bar .up { left: 50%; background: var(--pos); } .rank-bar .down { right: 50%; background: var(--neg); }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border-radius: 16px; padding: 14px 14px 12px; }
.stat-k { font-size: 12.5px; color: var(--sub); font-weight: 600; }
.stat-v { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin-top: 2px; }
.stat-d { font-size: 12.5px; color: var(--sub); }
.status { color: var(--faint); font-size: 12.5px; text-align: center; margin: 22px 0 8px; }

/* 추이 */
.chart-card { padding: 16px 0 6px; }
.readout { padding: 0 16px; min-height: 76px; }
.ro-label { font-size: 13px; color: var(--sub); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.ro-value { font-size: 34px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
.ro-date { font-size: 12.5px; color: var(--sub); }
#trend { display: block; width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
#trend text { fill: var(--faint); font-size: 11px; font-family: var(--font); }
.trend-note { display: flex; align-items: center; gap: 8px; padding: 6px 16px 8px; font-size: 13px; color: var(--sub); font-weight: 600; }
.trend-note .key { width: 22px; height: 0; border-top: 2px dashed var(--c); flex: none; }
.trend-note b { font-weight: 800; }
.at-list { list-style: none; padding: 0; }
.at-row { display: flex; align-items: center; gap: 10px; padding: 11px 16px; }
.at-row + .at-row { border-top: 1px solid var(--line); }
.at-row .n { color: var(--faint); font-weight: 800; width: 18px; font-size: 14px; }
.at-row .nm { flex: 1; display: flex; align-items: center; gap: 8px; font-weight: 600; }
.at-row .v { font-weight: 800; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form { display: flex; gap: 4px; margin-top: 6px; }
.form i { width: 18px; height: 18px; border-radius: 5px; background: var(--zero); display: block; }
.form i.w { background: var(--pos); } .form i.l { background: var(--neg); }

/* 월별 */
.month-card { padding: 18px 16px 8px; }
.mc-head { display: flex; justify-content: space-between; align-items: baseline; }
.mc-title { font-size: 20px; font-weight: 800; }
.mc-count { font-size: 13px; color: var(--sub); font-weight: 600; }
.mc-mvp { font-size: 13.5px; color: var(--sub); margin: 4px 0 14px; }
.mc-mvp b { color: var(--ink); }
.dv { display: grid; grid-template-columns: 72px 1fr 58px; align-items: center; gap: 10px; padding: 9px 0; }
.dv + .dv { border-top: 1px solid var(--line); }
.dv-name { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.dv-track { position: relative; height: 22px; }
.dv-track::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line); }
.dv-track span { position: absolute; top: 3px; bottom: 3px; border-radius: 4px; transform-origin: var(--o); animation: grow .5s cubic-bezier(.2,.8,.2,1) both; }
.dv-track .up { left: 50%; background: var(--pos); --o: left; } .dv-track .down { right: 50%; background: var(--neg); --o: right; }
.dv-track .none { left: calc(50% - 12px); width: 24px; top: 10px; bottom: 10px; background: var(--line); }
@keyframes grow { from { transform: scaleX(0); } }
.dv-val { text-align: right; font-weight: 800; font-size: 15px; }
.dv-val.absent { color: var(--faint); font-weight: 500; font-size: 13px; }
.mvp-list { list-style: none; padding: 0; margin-top: 0; }
.mvp-row { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 12px 16px; border: 0; background: none; text-align: left; }
.mvp-list li + li .mvp-row { border-top: 1px solid var(--line); }
.mvp-row .m { color: var(--sub); font-size: 14px; font-weight: 600; }
.mvp-row .nm { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.mvp-row .v { font-weight: 800; }
.mvp-row[aria-current="true"] { background: var(--surface-2); }

/* 경기 기록 */
.g-month { font-size: 13px; color: var(--sub); font-weight: 700; margin: 18px 4px 8px; }
.game { background: var(--surface); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
.game-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.game-date { font-size: 17px; font-weight: 800; }
.game-dow { color: var(--sub); font-size: 13px; font-weight: 600; }
.tag { margin-left: auto; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: color-mix(in srgb, var(--pc) 18%, transparent); color: color-mix(in srgb, var(--pc) 75%, var(--ink)); }
.edit-link { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--sub); text-decoration: none; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); }
.game-head .tag + .edit-link { margin-left: 6px; }
.game-res { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
.gr { display: flex; justify-content: space-between; align-items: center; font-size: 14.5px; }
.gr .nm { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.gr .v { font-weight: 800; }
.game-warn { margin-top: 8px; font-size: 12.5px; color: var(--warn); font-weight: 600; }
.empty { text-align: center; color: var(--sub); padding: 40px 0; }

/* 탭바 */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 600; color: var(--faint); }
.tabbar svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--ink); }
.view.switching { animation: fade .2s ease both; }
@keyframes fade { from { opacity: 0; } }

/* ===== 넓은 화면: 폴더블(펼침)·태블릿 ===== */
.rank-grid, .trend-grid, .month-grid { display: block; }
@media (min-width: 720px), (orientation: landscape) and (max-height: 500px) and (min-width: 600px) {
  .app { max-width: 980px; padding: 0 28px; }
  .large-title { font-size: 34px; }
  .rank-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "leader rank" "stats rank"; gap: 0 22px; align-items: start; }
  .rank-grid .leader { grid-area: leader; margin-top: 30px; }
  .rank-block { grid-area: rank; }
  .stats-block { grid-area: stats; }
  .tiles { grid-template-columns: repeat(3, 1fr); }
  .month-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 22px; align-items: start; }
  .mvp-block .group-title { margin-top: 0; }
  .month-card { margin-bottom: 0; }
  #games-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; align-items: start; }
  #games-list .g-month, #games-list .empty { grid-column: 1 / -1; }
  .scroller { margin: 0 0 14px; padding: 2px 0; flex-wrap: wrap; overflow: visible; }
  .toast { bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
}
/* ===== PC: 왼쪽 세로 메뉴 ===== */
@media (min-width: 1100px) {
  body { padding-bottom: 32px; padding-left: 96px; }
  .app { max-width: 1200px; padding: 8px 40px 0; }
  .large-title { font-size: 38px; margin-top: 18px; }
  .tabbar { top: 0; right: auto; width: 96px; grid-template-columns: 1fr; grid-auto-rows: 76px; align-content: start;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 8px 24px; border-top: 0; border-right: 1px solid var(--line); }
  .tabbar button { border-radius: 14px; gap: 4px; font-size: 12px; }
  .tabbar button[aria-current="page"] { background: var(--surface); }
  .rank-grid { grid-template-columns: 1.1fr 1fr; gap: 0 28px; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .trend-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); gap: 24px; align-items: start; }
  .trend-grid .chart-card { margin-bottom: 0; }
  #trend-detail .group-title { margin-top: 0; }
  .tiles { grid-template-columns: 1fr 1fr; }
  #games-list { grid-template-columns: repeat(3, 1fr); }
  .toast { bottom: 32px; left: calc(50% + 48px); }
}

/* ===== 공통: 글자 자동 확대 방지, 가로 모드 노치 영역 피하기 ===== */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
.app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
/* ===== 휴대폰 가로 모드: 하단 탭바 → 왼쪽 세로 메뉴로, 세로 공간 확보 ===== */
@media (orientation: landscape) and (max-height: 500px) {
  body { padding-bottom: 16px; padding-left: calc(76px + env(safe-area-inset-left, 0px)); }
  .app { padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }
  .tabbar { top: 0; right: auto; width: calc(76px + env(safe-area-inset-left, 0px)); grid-template-columns: 1fr; grid-auto-rows: 62px; align-content: center;
    padding: 8px 6px 8px calc(6px + env(safe-area-inset-left, 0px)); border-top: 0; border-right: 1px solid var(--line); }
  .tabbar button { border-radius: 12px; }
  .tabbar button[aria-current="page"] { background: var(--surface); }
  .large-title { font-size: 26px; margin-top: 8px; }
  .caption { margin-bottom: 12px; }
  .leader { padding: 16px 18px 14px; }
  .leader-value { font-size: 42px; }
  .rank-grid .leader { margin-top: 30px; }
  .readout { min-height: 64px; }
  .ro-value { font-size: 28px; }
  .toast { bottom: 20px; left: calc(50% + 38px); }
}

/* ===== 시즌 ===== */
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 6px 10px; flex-wrap: wrap; margin-top: 14px; }
.title-row .large-title { margin: 0; flex: 1 1 100%; }
.season-sel { flex: none; margin-left: auto; height: 34px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-size: 13.5px; font-weight: 800; padding: 0 30px 0 14px; -webkit-appearance: none; appearance: none;

<script>
const CONFIG = {
  TITLE: 'Tri-City Hold’em',
  RECORD_URL: 'record.html',
  PLAYER_COLORS: ['#E0A100', '#0F9B8E', '#7B4FC9', '#E0662A', '#4F7A99', '#C2417F', '#3E9A45', '#8C6D3F'],
  PLACE_COLORS: { '인천': '#3B82F6', '천안': '#10B981', '수원': '#F59E0B' }
};
const CACHE_KEY = 'holdem_cache_doc';
function afterReveal() {
  loadPosts();
  if (ME && ME.role === 'admin') api('GET', '/api/users').then(list => {
    const n = list.filter(u => u.status === 'pending' || u.resetRequestedAt).length;
    if (n) document.getElementById('admin-link').innerHTML = `Admin <span class="pend">${n}</span> ›`;
  }).catch(() => {});
}
const ME = Auth.require();
const CAN_EDIT = !!ME && ['editor', 'admin'].includes(ME.role);

/* ===== 유틸 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const signed = v => v > 0 ? '+' + v.toLocaleString('ko-KR') : v < 0 ? '−' + Math.abs(v).toLocaleString('ko-KR') : '0';
const tone = v => v > 0 ? 'pos' : v < 0 ? 'neg' : 'zero';
const pct = v => (v * 100).toFixed(1) + '%';
const D = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const ymd = s => s.slice(2).replace(/-/g, '.');
const ym = s => s.slice(0, 7);
const ymLabel = k => `${k.slice(0, 4)}년 ${Number(k.slice(5))}월`;
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const chip = c => `<span class="chip" style="--c:${c}" aria-hidden="true"></span>`;
const sum = a => a.reduce((x, y) => x + y, 0);
const toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1800); };

/* ===== 집계 ===== */
function analyze(doc) {
  const sessions = doc.sessions.slice().sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  if (!sessions.length) {
    const color = Object.fromEntries(doc.players.map((p, i) => [p, CONFIG.PLAYER_COLORS[i % CONFIG.PLAYER_COLORS.length]]));
    return { sessions, names: [], P: 0, N: 0, color, cum: [], stats: [], ranked: [], months: new Map(), best: null, worst: null, seats: 0, places: {} };
  }
  const names = doc.players.filter(p => sessions.some(s => p in s.res));
  const P = names.length, N = sessions.length;
  const color = Object.fromEntries(doc.players.map((p, i) => [p, CONFIG.PLAYER_COLORS[i % CONFIG.PLAYER_COLORS.length]]));
  const run = Object.fromEntries(names.map(p => [p, 0]));
  const cum = sessions.map(s => { for (const p in s.res) if (p in run) run[p] += s.res[p]; return { ...run }; });

  const stats = names.map(name => {
    const xs = sessions.filter(s => name in s.res).map(s => s.res[name]);
    const total = sum(xs);
    let w = 0, l = 0, bw = 0, bl = 0;
    xs.forEach(v => { if (v > 0) { w++; l = 0; } else if (v < 0) { l++; w = 0; } else { w = 0; l = 0; } bw = Math.max(bw, w); bl = Math.max(bl, l); });
    const path = cum.map(c => c[name]);
    return {
      name, color: color[name], total, n: xs.length, rate: N ? xs.length / N : 0,
      win: xs.length ? xs.filter(v => v > 0).length / xs.length : 0,
      per: xs.length ? total / xs.length : 0,
      max: Math.max(...xs), min: Math.min(...xs),
      peak: Math.max(0, ...path), trough: Math.min(0, ...path),
      bestStreak: bw, worstStreak: bl, last5: xs.slice(-5)
    };
  });
  const ranked = stats.slice().sort((a, b) => b.total - a.total);

  const months = new Map();
  sessions.forEach(s => {
    const k = ym(s.date);
    if (!months.has(k)) months.set(k, { k, cnt: 0, sum: {} });
    const m = months.get(k); m.cnt++;
    for (const p in s.res) m.sum[p] = (m.sum[p] || 0) + s.res[p];
  });

  let best = { v: -Infinity }, worst = { v: Infinity }, seats = 0;
  sessions.forEach(s => { for (const p in s.res) { seats++; const v = s.res[p];
    if (v > best.v) best = { v, who: p, d: s.date }; if (v < worst.v) worst = { v, who: p, d: s.date }; } });
  const places = {};
  sessions.forEach(s => { if (s.place) places[s.place] = (places[s.place] || 0) + 1; });
  return { sessions, names, P, N, color, cum, stats, ranked, months, best, worst, seats, places, updatedAt: doc.updatedAt };
}

/* ===== 시즌: 매년 10월 1일 ~ 다음 해 9월 30일, 2025.10 = 시즌 1 (날짜로 자동 계산) ===== */
const SEASON = { BASE_YEAR: 2025, START_MONTH: 10 };
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const seasonNo = date => Math.max(1, +date.slice(0, 4) - SEASON.BASE_YEAR + (+date.slice(5, 7) >= SEASON.START_MONTH ? 1 : 0));
function seasonInfo(n) {
  const y0 = SEASON.BASE_YEAR + n - 1, mm = String(SEASON.START_MONTH).padStart(2, '0'), em = String(SEASON.START_MONTH - 1 || 12).padStart(2, '0');
  const end = `${y0 + 1}-${em}-${new Date(y0 + 1, SEASON.START_MONTH - 1, 0).getDate()}`;
  return { n, label: `S${n}`, start: `${y0}-${mm}-01`, end, range: `${String(y0).slice(2)}.${mm}–${String(y0 + 1).slice(2)}.${em}`, live: seasonNo(todayStr()) === n };
}
let DOC = null, MA = null, MS = null, SEASONS = [];
let season = null;   // 숫자(시즌) 또는 'all'
try { const v = sessionStorage.getItem('holdem_season'); if (v) season = v === 'all' ? 'all' : Number(v); } catch (e) {}
const isAll = () => season === 'all';
const seasonLabel = () => isAll() ? '전체 기록' : `${seasonInfo(season).label} (${seasonInfo(season).range})`;
const subsetDoc = n => ({ ...DOC, sessions: DOC.sessions.filter(s => seasonNo(s.date) === n) });
function buildModels() {
  const cur = seasonNo(todayStr());
  SEASONS = [...new Set([...DOC.sessions.map(s => seasonNo(s.date)), cur])].sort((a, b) => b - a);
  if (season === null || (!isAll() && !SEASONS.includes(season))) season = cur;   // 기본값: 진행 중인 최신 시즌
  MA = analyze(DOC);
  MS = isAll() ? MA : analyze(subsetDoc(season));
}
function renderSeasonSelects() {
  const opts = SEASONS.map(n => { const i = seasonInfo(n); return `<option value="${n}">${i.label} · ${i.live ? '진행 중' : i.range}</option>`; }).join('') + `<option value="all">전체 기록</option>`;
  document.querySelectorAll('.season-sel').forEach(sel => { sel.innerHTML = opts; sel.value = String(season); });
}
document.addEventListener('change', e => {
  if (!e.target.classList.contains('season-sel')) return;
  season = e.target.value === 'all' ? 'all' : Number(e.target.value);
  try { sessionStorage.setItem('holdem_season', String(season)); } catch (err) {}
  month = null; scrub = null; buildModels(); renderSeasonSelects(); renderView(view);
});
const per1 = v => signed(Math.round(v * 10) / 10);
const statOf = (M, name) => M.stats.find(t => t.name === name);

/* ===== 순위 ===== */
function renderRank() {
  const M = MS, info = isAll() ? null : seasonInfo(season);
  document.title = CONFIG.TITLE;
  $('#title').textContent = CONFIG.TITLE;
  $('#caption').textContent = M.N
    ? `${seasonLabel()} ${M.N}경기, 최근 경기 ${ymd(M.sessions[M.N - 1].date)} ${M.sessions[M.N - 1].place}`
    : `${seasonLabel()} 아직 경기가 없습니다`;
  $('#stats-title').textContent = isAll() ? '전체 기록' : `${info.label} 시즌 기록`;

  if (!M.N) {
    $('#leader').innerHTML = `<div class="leader-label"><span class="crown" aria-hidden="true">♛</span>${info.label} 시즌</div>
      <div class="leader-name">첫 경기를 기다리고 있습니다</div><div class="leader-sub">${info.start.replace(/-/g, '.')} ~ ${info.end.replace(/-/g, '.')}</div>`;
    $('#rank-list').innerHTML = `<li><p class="empty">이번 시즌 기록이 아직 없습니다</p></li>`;
    $('#stat-grid').innerHTML = '';
  } else {
    const L = M.ranked[0], S2 = M.ranked[1];
    const days = info && info.live ? Math.ceil((D(info.end) - D(todayStr())) / 86400000) + 1 : null;
    const head = isAll() ? '전체 선두' : info.live ? `${info.label} 현재 선두` : `${info.label} 우승`;
    $('#leader').innerHTML = `
      <div class="leader-label"><span class="crown" aria-hidden="true">♛</span>${head}</div>
      <div class="leader-name">${chip(L.color)}${esc(L.name)}</div>
      <div class="leader-value">${signed(L.total)}</div>
      <div class="leader-sub">${S2 ? `2위 ${esc(S2.name)}와 ${(L.total - S2.total).toLocaleString('ko-KR')} 차이` : ''}${days !== null ? `${S2 ? ', ' : ''}시즌 종료까지 ${days}일` : ''}</div>`;
    const maxAbs = Math.max(1, ...M.ranked.map(t => Math.abs(t.total)));
    const rows = M.ranked.map((t, k) => {
      const all = statOf(MA, t.name);
      return `<li><button type="button" class="rank-row" data-p="${esc(t.name)}">
        <span class="rank-no">${k + 1}</span>
        <span class="rank-name">${chip(t.color)}${esc(t.name)}</span>
        <span class="rank-val ${tone(t.total)}">${signed(t.total)}</span>
        <span class="rank-meta">${t.n}경기, 승률 ${pct(t.win)}, 경기당 <b class="${tone(t.per)}">${per1(t.per)}</b></span>
        ${isAll() ? '' : `<span class="rank-meta2">전체 누적 <b class="${tone(all.total)}">${signed(all.total)}</b>, 전체 경기당 <b class="${tone(all.per)}">${per1(all.per)}</b></span>`}
        <span class="rank-bar" aria-hidden="true">${t.total ? `<span class="${t.total > 0 ? 'up' : 'down'}" style="width:${(Math.abs(t.total) / maxAbs * 50).toFixed(1)}%"></span>` : ''}</span>
      </button></li>`;
    });
    // 이번 시즌에 참가하지 않은 멤버는 아래에 흐리게
    MA.ranked.filter(t => !M.names.includes(t.name)).forEach(t => rows.push(`<li><button type="button" class="rank-row absent" data-p="${esc(t.name)}" data-all="1">
        <span class="rank-no">–</span><span class="rank-name">${chip(t.color)}${esc(t.name)}</span><span class="rank-val">참가 없음</span>
        <span class="rank-meta2">전체 누적 <b class="${tone(t.total)}">${signed(t.total)}</b>, 전체 경기당 <b class="${tone(t.per)}">${per1(t.per)}</b></span></button></li>`));
    $('#rank-list').innerHTML = rows.join('');
    const pl = Object.entries(M.places).sort((a, b) => b[1] - a[1]);
    $('#stat-grid').innerHTML = [
      ['최고 단일 수익', `<span class="pos">${signed(M.best.v)}</span>`, `${esc(M.best.who)}, ${ymd(M.best.d)}`],
      ['최대 단일 손실', `<span class="neg">${signed(M.worst.v)}</span>`, `${esc(M.worst.who)}, ${ymd(M.worst.d)}`],
      ['평균 참가 인원', `${(M.seats / M.N).toFixed(1)}명`, `연인원 ${M.seats}명`],
      ['자주 모인 곳', pl.length ? esc(pl[0][0]) : '-', pl.map(([k, v]) => `${esc(k)} ${v}`).join(', ')]
    ].map(([k, v, d]) => `<div class="stat"><div class="stat-k">${k}</div><div class="stat-v">${v}</div><div class="stat-d">${d}</div></div>`).join('');
  }
  $('#rank-list').onclick = e => {
    const b = e.target.closest('.rank-row'); if (!b) return;
    focus = b.dataset.p; trendScope = b.dataset.all ? 'all' : 'season'; go('trend');
  };

  // 전체 순위 (시즌을 볼 때만)
  $('#all-block').innerHTML = isAll() ? '' : `<div class="group-title">전체 순위 (${MA.N}경기)</div>
    <div class="group"><table class="all-table"><thead><tr><th>순위</th><th>누적</th><th>경기당</th><th>참가</th></tr></thead><tbody>
    ${MA.ranked.map((t, k) => `<tr><td class="nm"><span class="r">${k + 1}</span>${chip(t.color)}${esc(t.name)}</td>
      <td class="${tone(t.total)}">${signed(t.total)}</td><td class="${tone(t.per)}">${per1(t.per)}</td><td class="sub">${t.n}경기</td></tr>`).join('')}
    </tbody></table></div>`;
  // 시즌 챔피언
  $('#champ-block').innerHTML = `<div class="group-title">시즌 챔피언</div><ol class="group champ-list">${SEASONS.map(n => {
    const i = seasonInfo(n), Mx = n === season ? MS : analyze(subsetDoc(n)), w = Mx.ranked[0];
    return `<li class="champ${i.live ? ' live' : ''}"><span class="sn">${i.label}<span class="sr">${i.range}</span></span>
      ${w ? `<span class="nm">${chip(w.color)}<span>${esc(w.name)}<span class="st">${Mx.N}경기${i.live ? ', 현재 1위' : ''}</span></span></span><span class="v ${tone(w.total)}">${signed(w.total)}</span>`
          : `<span class="nm"><span class="st">아직 경기가 없습니다</span></span><span></span>`}</li>`;
  }).join('')}</ol>`;
}

/* ===== 추이 ===== */
let focus = null, scrub = null, trendScope = 'season';
const trendModel = () => (isAll() || trendScope === 'all') ? MA : MS;
function renderTrendPlayers(M) {
  const opts = [['', '전체'], ...M.ranked.map(t => [t.name, t.name])];
  $('#trend-players').innerHTML = opts.map(([v, t]) =>
    `<button type="button" class="pill" data-p="${esc(v)}" aria-pressed="${(focus || '') === v}">${v ? chip(M.color[v]) : ''}${esc(t)}</button>`).join('');
  $('#trend-players').onclick = e => { const b = e.target.closest('.pill'); if (!b) return; focus = b.dataset.p || null; scrub = null; renderTrend(); };
}
$('#trend-scope').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  trendScope = b.dataset.s; scrub = null; renderTrend();
});
function niceStep(range, count) {
  const raw = range / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / mag;
  return (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag;
}

function renderTrend() {
  const M = trendModel();
  $('#trend-scope').hidden = isAll();
  $('#trend-scope').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === (isAll() ? 'all' : trendScope)));
  if (focus && !M.names.includes(focus)) focus = null;
  renderTrendPlayers(M);
  if (!M.N) {
    $('#trend').innerHTML = ''; $('#trend').setAttribute('height', 0); $('#trend-note').hidden = true;
    $('#ro-label').textContent = seasonLabel(); $('#ro-value').textContent = '아직 경기가 없습니다'; $('#ro-date').textContent = '전체 버튼을 누르면 지난 기록을 볼 수 있습니다';
    $('#trend-detail').innerHTML = ''; return;
  }
  const svg = $('#trend');
  const W = svg.parentElement.clientWidth || 360;
  const H = Math.round(Math.min(W >= 900 ? 360 : W >= 600 ? 300 : 230, Math.max(190, innerHeight - 200)));
  const m = { l: 12, r: 46, t: 10, b: 24 };
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('height', H);
  const { cum, sessions, names, color } = M, n = sessions.length;
  const lines = focus ? [focus] : names;
  let fit = null;
  if (focus) {
    const j0 = sessions.findIndex(s => focus in s.res);
    const pts = cum.slice(j0).map((c, k) => [j0 + k, c[focus]]);
    if (pts.length >= 3) {
      const mx = sum(pts.map(q => q[0])) / pts.length, my = sum(pts.map(q => q[1])) / pts.length;
      const sxx = sum(pts.map(q => (q[0] - mx) ** 2)), sxy = sum(pts.map(q => (q[0] - mx) * (q[1] - my)));
      const slope = sxx ? sxy / sxx : 0, icpt = my - slope * mx;
      fit = { j0, j1: n - 1, slope, y0: icpt + slope * j0, y1: icpt + slope * (n - 1) };
    }
  }
  const vals = cum.flatMap(c => lines.map(p => c[p])).concat(fit ? [fit.y0, fit.y1] : []);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (lo === hi) { lo -= 10; hi += 10; }
  const step = niceStep(hi - lo, 4);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = i => m.l + (n <= 1 ? 0 : i * (W - m.l - m.r) / (n - 1));
  const y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  const path = p => cum.map((c, j) => `${j ? 'L' : 'M'}${x(j).toFixed(1)} ${y(c[p]).toFixed(1)}`).join('');

  let g = `<defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${focus ? color[focus] : '#000'}" stop-opacity=".28"/><stop offset="1" stop-color="${focus ? color[focus] : '#000'}" stop-opacity="0"/></linearGradient></defs>`;
  for (let v = lo; v <= hi + 1e-9; v += step) {
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v === 0 ? 'stroke-dasharray="3 4" stroke="var(--faint)"' : ''}/>`;
    g += `<text x="${W - m.r + 6}" y="${y(v) + 4}">${signed(v)}</text>`;
  }
  let lastX = -99, prev = '';
  sessions.forEach((s, i) => { const k = ym(s.date);
    if (k !== prev && x(i) - lastX > 52) { g += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : 'middle'}">${k.slice(2).replace('-', '.')}</text>`; lastX = x(i); }
    prev = k; });
  if (focus) {
    names.filter(p => p !== focus).forEach(p => { g += `<path d="${path(p)}" fill="none" stroke="var(--faint)" stroke-opacity=".35" stroke-width="1.2"/>`; });
    g += `<path d="${path(focus)}L${x(n - 1)} ${y(0)}L${x(0)} ${y(0)}Z" fill="url(#area)"/>`;
    g += `<path d="${path(focus)}" fill="none" stroke="${color[focus]}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (fit) g += `<line x1="${x(fit.j0)}" y1="${y(fit.y0)}" x2="${x(fit.j1)}" y2="${y(fit.y1)}" stroke="var(--ink)" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round"/>`;
  } else {
    names.forEach(p => { g += `<path d="${path(p)}" fill="none" stroke="${color[p]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`; });
  }
  const j = scrub ?? n - 1;
  g += `<line x1="${x(j)}" x2="${x(j)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--sub)" stroke-width="1" ${scrub === null ? 'stroke-opacity="0"' : ''}/>`;
  lines.forEach(p => { g += `<circle cx="${x(j)}" cy="${y(cum[j][p])}" r="${focus ? 5 : 3.5}" fill="${color[p]}" stroke="var(--surface)" stroke-width="2"/>`; });
  svg.innerHTML = g;

  // 읽기 영역
  const s = sessions[j];
  const dateTxt = `${ymd(s.date)} (${DOW[D(s.date).getDay()]}) ${s.place}${scrub === null ? ', 최신' : ''}`;
  if (focus) {
    $('#ro-label').innerHTML = `${chip(color[focus])}${esc(focus)} 누적`;
    $('#ro-value').innerHTML = `<span class="${tone(cum[j][focus])}">${signed(cum[j][focus])}</span>`;
    const d = s.res[focus];
    $('#ro-date').textContent = dateTxt + (d === undefined ? ', 불참' : `, 이날 ${signed(d)}`);
  } else {
    const top = names.slice().sort((a, b) => cum[j][b] - cum[j][a])[0];
    $('#ro-label').innerHTML = `이 시점 1위`;
    $('#ro-value').innerHTML = `${chip(color[top])} ${esc(top)} <span class="${tone(cum[j][top])}">${signed(cum[j][top])}</span>`;
    $('#ro-date').textContent = dateTxt;
  }

  // 추세 설명
  const note = $('#trend-note');
  if (fit) {
    const v = Math.round(fit.slope * 10) / 10;
    const word = Math.abs(v) < 1 ? '보합 흐름' : v > 0 ? '상승 흐름' : '하락 흐름';
    note.hidden = false;
    note.innerHTML = `<span class="key" style="--c:var(--ink)" aria-hidden="true"></span>추세선 기울기, 리그 1경기당 <b class="${tone(v)}">${signed(v)}</b><span>${word}</span>`;
  } else note.hidden = true;

  // 하단 상세
  if (focus) {
    $('#trend-detail').innerHTML = `<div class="group-title">${esc(focus)} 기록 (${trendModel() === MA ? '전체' : seasonInfo(season).label})</div>${personTiles(focus)}`;
  } else {
    const order = names.slice().sort((a, b) => cum[j][b] - cum[j][a]);
    $('#trend-detail').innerHTML = `<div class="group-title">이 시점 순위</div><ol class="group at-list">${order.map((p, k) =>
      `<li class="at-row"><span class="n">${k + 1}</span><span class="nm">${chip(color[p])}${esc(p)}</span><span class="v ${tone(cum[j][p])}">${signed(cum[j][p])}</span></li>`).join('')}</ol>`;
  }

  // 손가락으로 밀기
  const pick = e => {
    const r = svg.getBoundingClientRect();
    const vx = (e.clientX - r.left) / r.width * W;
    const k = Math.max(0, Math.min(n - 1, Math.round((vx - m.l) / ((W - m.l - m.r) / Math.max(1, n - 1)))));
    if (k !== scrub) { scrub = k; renderTrend(); if (navigator.vibrate) navigator.vibrate(4); }
  };
  svg.onpointerdown = e => { svg.setPointerCapture(e.pointerId); pick(e); };
  svg.onpointermove = e => { if (e.buttons || e.pointerType === 'mouse') pick(e); };
  svg.onpointerup = svg.onpointercancel = svg.onpointerleave = () => { if (scrub !== null) { scrub = null; renderTrend(); } };
}
const tile = (k, v, d) => `<div class="stat"><div class="stat-k">${k}</div><div class="stat-v">${v}</div><div class="stat-d">${d}</div></div>`;
// 개인 기록: 큰 값은 지금 보는 범위(시즌 또는 전체), 작은 줄은 비교 값
function personTiles(name) {
  const sS = statOf(MS, name), sA = statOf(MA, name);
  const main = isAll() ? sA : (trendScope === 'all' ? sA : sS), cmp = isAll() ? null : (trendScope === 'all' ? sS : sA);
  const cmpLabel = trendScope === 'all' ? seasonInfo(season).label : '전체';
  const c = f => cmp ? `${cmpLabel} ${f(cmp)}` : '';
  if (!main) return `<p class="empty">이 범위에는 참가 기록이 없습니다</p>`;
  return `<div class="tiles">
    ${tile('경기당 평균', `<span class="${tone(main.per)}">${per1(main.per)}</span>`, c(t => per1(t.per)) || `${main.n}경기 기준`)}
    ${tile('누적 손익', `<span class="${tone(main.total)}">${signed(main.total)}</span>`, c(t => signed(t.total)) || `${main.n}경기 참가`)}
    ${tile('최고 스택', `<span class="pos">${signed(main.peak)}</span>`, c(t => signed(t.peak)) || '가장 높았던 누적')}
    ${tile('최저 스택', `<span class="neg">${signed(main.trough)}</span>`, c(t => signed(t.trough)) || '가장 낮았던 누적')}
    ${tile('최다 연승', `${main.bestStreak}연승`, c(t => t.bestStreak + '연승') || `승률 ${pct(main.win)}`)}
    ${tile('최다 연패', `${main.worstStreak}연패`, c(t => t.worstStreak + '연패') || `${main.n}경기 참가`)}
    ${tile('최고 단일', `<span class="pos">${signed(main.max)}</span>`, `최저 ${signed(main.min)}`)}
    ${tile('최근 5경기', `<span class="${tone(sum(main.last5))}">${signed(sum(main.last5))}</span>`, `<span class="form">${main.last5.map(v => `<i class="${v > 0 ? 'w' : v < 0 ? 'l' : ''}"></i>`).join('')}</span>`)}
  </div>`;
}

/* ===== 월별 ===== */
let month = null;
function renderMonth() {
  const M = MS;
  // 시즌 합계 (시즌을 볼 때만)
  if (!isAll() && M.N) {
    const maxAbs = Math.max(1, ...M.ranked.map(t => Math.abs(t.total)));
    $('#season-sum').innerHTML = `<div class="mc-head"><span class="mc-title">${seasonInfo(season).label} 시즌 합계</span><span class="mc-count">${M.months.size}개월, ${M.N}경기</span></div>
      <p class="mc-mvp">${seasonInfo(season).range}</p>
      ${M.ranked.map(t => `<div class="dv"><span class="dv-name">${chip(t.color)}${esc(t.name)}</span>
        <span class="dv-track" aria-hidden="true">${t.total ? `<span class="${t.total > 0 ? 'up' : 'down'}" style="width:${(Math.abs(t.total) / maxAbs * 50).toFixed(1)}%"></span>` : ''}</span>
        <span class="dv-val ${tone(t.total)}">${signed(t.total)}</span></div>`).join('')}`;
  } else $('#season-sum').innerHTML = '';

  const keys = [...M.months.keys()].sort().reverse();
  $('#month-caption').textContent = M.N ? `${seasonLabel()} ${keys.length}개월의 월간 손익` : `${seasonLabel()} 아직 경기가 없습니다`;
  if (!keys.length) { $('#month-tabs').innerHTML = ''; $('#month-card').innerHTML = `<p class="empty">이번 시즌 기록이 아직 없습니다</p>`; }
  else {
    if (!month || !M.months.has(month)) month = keys[0];
    $('#month-tabs').innerHTML = keys.map(k => `<button type="button" class="pill" data-m="${k}" aria-pressed="${k === month}">${k.slice(2).replace('-', '.')}</button>`).join('');
    $('#month-tabs').onclick = e => { const b = e.target.closest('.pill'); if (!b) return; month = b.dataset.m; renderMonth(); };
    const mo = M.months.get(month);
    const rows = M.names.map(p => ({ p, v: mo.sum[p] })).sort((a, b) => (b.v ?? -1e9) - (a.v ?? -1e9));
    const maxAbs = Math.max(1, ...rows.filter(r => r.v !== undefined).map(r => Math.abs(r.v)));
    const top = rows[0];
    $('#month-card').innerHTML = `
      <div class="mc-head"><span class="mc-title">${ymLabel(month)}</span><span class="mc-count">${mo.cnt}경기</span></div>
      <p class="mc-mvp">이달의 1위 <b>${esc(top.p)} ${signed(top.v)}</b></p>
      ${rows.map(({ p, v }) => `<div class="dv">
        <span class="dv-name">${chip(M.color[p])}${esc(p)}</span>
        <span class="dv-track" aria-hidden="true">${v === undefined ? '<span class="none"></span>' : v === 0 ? '' : `<span class="${v > 0 ? 'up' : 'down'}" style="width:${(Math.abs(v) / maxAbs * 50).toFixed(1)}%"></span>`}</span>
        <span class="dv-val ${v === undefined ? 'absent' : tone(v)}">${v === undefined ? '불참' : signed(v)}</span></div>`).join('')}`;
    const sel = $('#month-tabs [aria-pressed="true"]'); if (sel) sel.scrollIntoView({ inline: 'nearest', block: 'nearest' });
  }

  // 월간 1위: 전체 기간을 시즌별로 묶어서
  const allKeys = [...MA.months.keys()].sort().reverse();
  let html = '', prevS = null;
  allKeys.forEach(k => {
    const n = seasonNo(k + '-01');
    if (n !== prevS) { const i = seasonInfo(n); html += `<li class="mvp-sec">${i.label} · ${i.range}${i.live ? ' (진행 중)' : ''}</li>`; prevS = n; }
    const sm = MA.months.get(k).sum, w = Object.keys(sm).sort((a, b) => sm[b] - sm[a])[0];
    html += `<li><button type="button" class="mvp-row" data-m="${k}" aria-current="${k === month && (isAll() || n === season)}">
      <span class="m">${k.slice(2).replace('-', '.')}</span><span class="nm">${chip(MA.color[w])}${esc(w)}</span><span class="v ${tone(sm[w])}">${signed(sm[w])}</span></button></li>`;
  });
  $('#mvp-list').innerHTML = html;
  $('#mvp-list').onclick = e => {
    const b = e.target.closest('.mvp-row'); if (!b) return;
    const n = seasonNo(b.dataset.m + '-01');
    if (!isAll() && n !== season) { season = n; try { sessionStorage.setItem('holdem_season', String(n)); } catch (err) {} buildModels(); renderSeasonSelects(); }
    month = b.dataset.m; renderMonth(); window.scrollTo({ top: 0, behavior: 'smooth' });
  };
}

/* ===== 경기 기록 ===== */
const gf = { place: '', player: '' };
function gameCards(list) {
  let html = '', prev = '';
  list.forEach(s => {
    const k = ym(s.date);
    if (k !== prev) { html += `<div class="g-month">${ymLabel(k)}</div>`; prev = k; }
    const res = Object.entries(s.res).sort((a, b) => b[1] - a[1]);
    const total = sum(res.map(r => r[1]));
    html += `<article class="game">
      <div class="game-head"><span class="game-date">${s.date.slice(5).replace('-', '.')}</span><span class="game-dow">${DOW[D(s.date).getDay()]}요일, ${res.length}명</span>
        ${s.place ? `<span class="tag" style="--pc:${CONFIG.PLACE_COLORS[s.place] || '#8A9A92'}">${esc(s.place)}</span>` : ''}
        ${CAN_EDIT ? `<a class="edit-link" href="${CONFIG.RECORD_URL}?edit=${encodeURIComponent(s.id)}" aria-label="${s.date} 경기 수정">수정</a>` : ''}</div>
      <div class="game-res">${res.map(([p, v]) => `<div class="gr"><span class="nm">${chip(MA.color[p])}${esc(p)}</span><span class="v ${tone(v)}">${signed(v)}</span></div>`).join('')}</div>
      ${total !== 0 ? `<div class="game-warn">합계가 ${signed(total)}입니다. 기록을 확인해 주세요.</div>` : ''}
    </article>`;
  });
  return html;
}
function renderGames() {
  const places = Object.keys(MA.places).sort((a, b) => MA.places[b] - MA.places[a]);
  $('#games-place').innerHTML = [['', '전체 장소'], ...places.map(p => [p, p])].map(([v, t]) =>
    `<button type="button" class="pill" data-v="${esc(v)}" aria-pressed="${gf.place === v}">${esc(t)}</button>`).join('');
  $('#games-player').innerHTML = [['', '전체 플레이어'], ...MA.ranked.map(t => [t.name, t.name])].map(([v, t]) =>
    `<button type="button" class="pill" data-v="${esc(v)}" aria-pressed="${gf.player === v}">${v ? chip(MA.color[v]) : ''}${esc(t)}</button>`).join('');
  $('#games-place').onclick = e => { const b = e.target.closest('.pill'); if (!b) return; gf.place = b.dataset.v; renderGames(); };
  $('#games-player').onclick = e => { const b = e.target.closest('.pill'); if (!b) return; gf.player = b.dataset.v; renderGames(); };
  const pass = s => (!gf.place || s.place === gf.place) && (!gf.player || gf.player in s.res);
  const all = MA.sessions.slice().reverse().filter(pass);
  if (isAll()) {
    $('#games-caption').textContent = `전체 기록 ${all.length}경기`;
    $('#games-list').innerHTML = all.length ? gameCards(all) : `<p class="empty">조건에 맞는 경기가 없습니다. 필터를 바꿔 보세요.</p>`;
    return;
  }
  const cur = all.filter(s => seasonNo(s.date) === season);
  $('#games-caption').textContent = `${seasonLabel()} ${cur.length}경기, 전체 ${all.length}경기`;
  let html = cur.length ? gameCards(cur) : `<p class="empty">${seasonInfo(season).label} 시즌에 조건에 맞는 경기가 없습니다</p>`;
  // 다른 시즌은 접어서 아래에
  SEASONS.filter(n => n !== season).forEach(n => {
    const list = all.filter(s => seasonNo(s.date) === n); if (!list.length) return;
    const i = seasonInfo(n);
    html += `<details class="past"><summary>${i.label} · ${i.range}<span class="c">${list.length}경기</span></summary><div class="past-in">${gameCards(list)}</div></details>`;
  });
  $('#games-list').innerHTML = html;
}
/* ===== 게시판 ===== */
let POSTS = null, boardFilter = '';
const BOARD_SEEN = 'holdem_board_seen';
const TYPE_KO = { notice: '공지사항', free: '자유' };
const when = iso => { const d = new Date(iso); return `${String(d.getFullYear()).slice(2)}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${d.toTimeString().slice(0, 5)}`; };
async function loadPosts() {
  try { POSTS = await api('GET', '/api/posts'); } catch (e) { POSTS = POSTS || []; toast(e.message); }
  markNew();
}
function markNew() {
  const seen = localStorage.getItem(BOARD_SEEN) || '';
  const latest = (POSTS || []).reduce((m, p) => p.at > m ? p.at : m, '');
  $('#board-dot').hidden = !(latest && latest > seen && (POSTS || []).some(p => p.at > seen && p.by !== ME.id));
}
function renderBoard() {
  if (!POSTS) { $('#board-list').innerHTML = '<p class="empty">불러오는 중…</p>'; loadPosts().then(renderBoard); return; }
  try { localStorage.setItem(BOARD_SEEN, POSTS.reduce((m, p) => p.at > m ? p.at : m, localStorage.getItem(BOARD_SEEN) || '')); } catch (e) {}
  $('#board-dot').hidden = true;
  const nN = POSTS.filter(p => p.type === 'notice').length, nF = POSTS.length - nN;
  $('#board-caption').textContent = `공지사항 ${nN}개, 자유 ${nF}개`;
  $('#board-filter').innerHTML = [['', '전체'], ['notice', '공지사항'], ['free', '자유']].map(([v, t]) =>
    `<button type="button" class="pill" data-v="${v}" aria-pressed="${boardFilter === v}">${t}</button>`).join('');
  $('#board-filter').onclick = e => { const b = e.target.closest('.pill'); if (!b) return; boardFilter = b.dataset.v; renderBoard(); };
  // 공지는 항상 위에, 그 다음 최신 글 순
  const list = POSTS.filter(p => !boardFilter || p.type === boardFilter)
    .sort((a, b) => (a.type === 'notice') !== (b.type === 'notice') ? (a.type === 'notice' ? -1 : 1) : b.at.localeCompare(a.at));
  $('#board-list').innerHTML = list.length ? list.map(p => `<button type="button" class="post ${p.type}" data-id="${p.id}">
      <div class="post-top"><span class="ptype ${p.type}">${p.type === 'notice' ? '📌 ' : ''}${TYPE_KO[p.type]}</span><span class="post-title">${esc(p.title)}</span></div>
      <div class="post-pre">${esc(p.body)}</div>
      <div class="post-info">${esc(p.byName)} · ${when(p.at)}${p.updatedAt ? ' (수정됨)' : ''}</div>
    </button>`).join('') : `<p class="empty">아직 글이 없습니다. 첫 글을 남겨 보세요.</p>`;
  $('#board-list').onclick = e => { const b = e.target.closest('.post'); if (b) openPost(b.dataset.id); };
}
function openPost(id) {
  const p = POSTS.find(x => x.id === id); if (!p) return;
  $('#post-type').className = 'ptype ' + p.type; $('#post-type').textContent = (p.type === 'notice' ? '📌 ' : '') + TYPE_KO[p.type];
  $('#post-title').textContent = p.title;
  $('#post-meta').textContent = `${p.byName} · ${when(p.at)}${p.updatedAt ? ` · 수정 ${when(p.updatedAt)}` : ''}`;
  $('#post-body').textContent = p.body;
  const can = p.by === ME.id || ME.role === 'admin';
  $('#post-acts').innerHTML = can ? `<button type="button" data-a="edit">수정</button><button type="button" class="del" data-a="del">삭제</button>` : '';
  $('#post-acts').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'edit') { $('#post-sheet').hidden = true; openWrite(p); }
    if (b.dataset.a === 'del' && confirm('이 글을 삭제할까요?')) {
      try { POSTS = await api('DELETE', '/api/posts/' + p.id); $('#post-sheet').hidden = true; toast('삭제했습니다'); renderBoard(); } catch (err) { toast(err.message); }
    }
  };
  $('#post-sheet').hidden = false;
}
let editingPost = null, wType = 'free';
function openWrite(p) {
  editingPost = p || null;
  const isAdmin = ME.role === 'admin';
  wType = p ? p.type : 'free';
  $('#write-title').textContent = p ? '글 수정' : '글쓰기';
  $('#w-type').innerHTML = [['notice', '공지사항'], ['free', '자유']].map(([v, t]) =>
    `<button type="button" data-v="${v}" aria-pressed="${wType === v}" ${v === 'notice' && !isAdmin ? 'disabled title="관리자만 작성할 수 있습니다"' : ''}>${t}</button>`).join('');
  $('#w-author').value = p ? p.byName : ME.name;   // 작성자는 회원 이름으로 고정
  $('#w-title').value = p ? p.title : ''; $('#w-body').value = p ? p.body : '';
  $('#w-msg').textContent = isAdmin ? '' : '공지사항은 관리자만 작성할 수 있습니다';
  $('#w-btn').textContent = p ? '수정 저장' : '등록';
  validateWrite(); $('#write-sheet').hidden = false; setTimeout(() => $('#w-title').focus(), 60);
}
function validateWrite() {
  $('#w-count').textContent = `${$('#w-body').value.length}/3000`;
  $('#w-btn').disabled = !($('#w-title').value.trim() && $('#w-body').value.trim());
}
$('#w-type').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  wType = b.dataset.v; $('#w-type').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === wType));
});
$('#write-form').addEventListener('input', validateWrite);
$('#write-form').addEventListener('submit', async e => {
  e.preventDefault(); const btn = $('#w-btn'); btn.disabled = true;
  const body = { type: wType, title: $('#w-title').value.trim(), body: $('#w-body').value.trim() };
  try {
    POSTS = editingPost ? await api('PUT', '/api/posts/' + editingPost.id, body) : await api('POST', '/api/posts', body);
    $('#write-sheet').hidden = true; toast(editingPost ? '수정했습니다' : '등록했습니다'); boardFilter = ''; renderBoard();
  } catch (err) { $('#w-msg').className = 'sheet-msg bad'; $('#w-msg').textContent = err.message; validateWrite(); }
});
$('#write-btn').addEventListener('click', () => openWrite(null));
document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) e.target.closest('.sheet').hidden = true;
  else if (e.target.classList && e.target.classList.contains('sheet') && e.target.id !== 'me-sheet') e.target.hidden = true;
});

/* ===== 화면 전환 ===== */
let view = 'rank';
const renderView = v => ({ rank: renderRank, trend: renderTrend, month: renderMonth, games: renderGames, board: renderBoard })[v]();
function go(v) {
  view = v;
  const booting = document.documentElement.classList.contains('booting');
  document.querySelectorAll('.view').forEach(el => {
    el.hidden = el.id !== 'v-' + v;
    el.classList.remove('switching');
    if (!el.hidden && !booting) { void el.offsetWidth; el.classList.add('switching'); }
  });
  document.querySelectorAll('.tabbar button').forEach(b => { if (b.dataset.v === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (!booting) window.scrollTo(0, 0);
  if (MA) renderView(v);
  try { history.replaceState(null, '', '#' + v); } catch (e) {}
}
$('.tabbar').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.v); });

/* ===== 데이터 ===== */
function show(doc, note) {
  if (!doc.sessions.length) { $('#v-rank').insertAdjacentHTML('beforeend', '<p class="empty">아직 기록된 경기가 없습니다. 기록 페이지에서 첫 경기를 등록하세요.</p>'); return; }
  DOC = doc; buildModels(); renderSeasonSelects();
  go(view);
  if (view !== 'rank') renderRank();
  $('#status').textContent = note;
}
async function load() {
  const btn = $('#reload'); btn.classList.add('spin');
  try {
    const doc = await api('GET', '/api/data');
    try { sessionStorage.setItem(CACHE_KEY, JSON.stringify(doc)); } catch (e) {}
    const t = new Date(doc.updatedAt);
    show(doc, `마지막 기록 ${t.getMonth() + 1}월 ${t.getDate()}일 ${t.getHours()}:${String(t.getMinutes()).padStart(2, '0')}`);
  } catch (err) {
    let doc = null; try { doc = JSON.parse(sessionStorage.getItem(CACHE_KEY)); } catch (e) {}
    if (doc) show(doc, '연결할 수 없어 마지막으로 받은 기록을 표시합니다.');
    toast(err.message || '기록을 불러오지 못했습니다.');
  } finally { btn.classList.remove('spin'); afterReveal(); }
}
$('#reload').addEventListener('click', load);
$('#rec-link').href = CONFIG.RECORD_URL;
if (ME) {
  $('#me-name').textContent = ME.name;
  $('#rec-link').hidden = !CAN_EDIT;
  $('#admin-link').hidden = ME.role !== 'admin';

}
$('#logout').addEventListener('click', () => { if (confirm('로그아웃할까요?')) Auth.logout(); });
/* 내 계정: 비밀번호 변경 */
const ROLE_KO = { viewer: '조회', editor: '기록', admin: '관리자' };
$('#me-btn').addEventListener('click', () => { $('#me-info').textContent = `${ME.name} (${ME.id}), 권한: ${ROLE_KO[ME.role]}`; $('#pw-form').reset(); $('#pw-msg').textContent = ''; $('#pw-btn').disabled = true; $('#me-sheet').hidden = false; });
$('#me-close').addEventListener('click', () => { $('#me-sheet').hidden = true; });
$('#me-sheet').addEventListener('click', e => { if (e.target.id === 'me-sheet') $('#me-sheet').hidden = true; });
$('#pw-form').addEventListener('input', () => {
  const n = $('#pw-new').value, n2 = $('#pw-new2').value, msg = $('#pw-msg');
  const ok = n.length >= 8 && /[A-Za-z]/.test(n) && /\d/.test(n);
  msg.className = 'sheet-msg' + (n && !ok ? ' bad' : n2 && n !== n2 ? ' bad' : '');
  msg.textContent = n && !ok ? '영문과 숫자를 섞어 8자 이상 입력하세요' : n2 && n !== n2 ? '새 비밀번호가 일치하지 않습니다' : '';
  $('#pw-btn').disabled = !($('#pw-cur').value && ok && n === n2);
});
$('#pw-form').addEventListener('submit', async e => {
  e.preventDefault(); const btn = $('#pw-btn'), msg = $('#pw-msg'); btn.disabled = true;
  try {
    await api('PUT', '/api/password', { current: $('#pw-cur').value, password: $('#pw-new').value });
    msg.className = 'sheet-msg ok'; msg.textContent = '비밀번호를 바꿨습니다. 다른 기기에서는 다시 로그인해야 합니다.'; $('#pw-form').reset();
  } catch (err) { msg.className = 'sheet-msg bad'; msg.textContent = err.message; btn.disabled = false; }
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (MA && view === 'trend') renderTrend(); }, 150); });
view = (location.hash.slice(1) in { rank: 1, trend: 1, month: 1, games: 1, board: 1 }) ? location.hash.slice(1) : 'rank';
if (ME) load();
</script>
</body>
</html>
